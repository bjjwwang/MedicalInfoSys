<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疑难病诊疗方案商城 - 流程原型</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { box-sizing: border-box; }
:root {
    --bg: #eef2f6;
    --paper: #ffffff;
    --ink: #1f2937;
    --muted: #617083;
    --line: #d8e0ea;
    --dark: #203246;
    --blue: #2c6fad;
    --teal: #168f83;
    --green: #357f4d;
    --amber: #b7791f;
    --coral: #c2414e;
    --purple: #6b46c1;
    --soft-blue: #edf4ff;
    --soft-teal: #e6f6f4;
    --soft-green: #e9f7ef;
    --soft-amber: #fff4dd;
    --soft-coral: #ffecef;
    --shadow: 0 18px 42px rgba(31, 41, 55, 0.11);
}
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.58;
    overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 22px;
    background: rgba(255, 255, 255, .94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(14px);
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
}
.brand-mark {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: var(--soft-teal);
    color: var(--teal);
}
.top-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.top-actions a {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: #344054;
    font-weight: 800;
}
.shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 18px;
}
.intro {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: end;
    margin-bottom: 14px;
}
.intro h1, .intro p { margin: 0; }
.intro h1 {
    font-size: 28px;
    line-height: 1.22;
}
.intro p {
    color: var(--muted);
    margin-top: 8px;
    max-width: 760px;
}
.step-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 18px;
}
.step-tab {
    border: 1px solid var(--line);
    background: #fff;
    color: #344054;
    min-height: 38px;
    padding: 8px 11px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 850;
    cursor: pointer;
}
.step-tab.active {
    background: var(--dark);
    color: #fff;
    border-color: var(--dark);
}
.workspace {
    display: grid;
    grid-template-columns: minmax(420px, 1fr) 430px;
    gap: 18px;
    align-items: start;
}
.panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    min-width: 0;
}
.db-panel {
    padding: 18px;
}
.panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
}
.panel-head h2, .panel-head p { margin: 0; }
.panel-head h2 {
    font-size: 21px;
    line-height: 1.25;
}
.panel-head p {
    color: var(--muted);
    margin-top: 6px;
}
.badge {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
}
.db-flow {
    display: grid;
    gap: 12px;
}
.db-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
}
.db-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: #f6f8fb;
    border-bottom: 1px solid var(--line);
}
.db-table {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-weight: 800;
    color: #203246;
}
.db-op {
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    border-radius: 999px;
    padding: 3px 8px;
    background: var(--blue);
}
.db-op.insert { background: var(--green); }
.db-op.update { background: var(--amber); }
.db-op.select { background: var(--purple); }
.db-op.freeze { background: var(--coral); }
.db-body {
    padding: 12px;
}
.db-row {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #e4e9ef;
}
.db-row:last-child { border-bottom: 0; }
.db-key {
    color: var(--muted);
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
}
.db-val {
    overflow-wrap: anywhere;
    font-weight: 720;
}
.explain {
    margin-top: 14px;
    padding: 13px 14px;
    border-left: 4px solid var(--teal);
    border-radius: 0 10px 10px 0;
    background: var(--soft-teal);
    color: #29465b;
}
.phone-area {
    display: grid;
    justify-content: center;
    gap: 12px;
}
.phone-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    color: var(--muted);
    font-weight: 800;
}
.phone {
    width: 390px;
    height: 780px;
    border-radius: 38px;
    background: #111827;
    padding: 14px;
    box-shadow: 0 24px 55px rgba(17, 24, 39, .28);
    position: relative;
}
.phone::before {
    content: "";
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 23px;
    border-radius: 0 0 16px 16px;
    background: #111827;
    z-index: 2;
}
.screen {
    height: 100%;
    overflow: hidden;
    border-radius: 28px;
    background: #f7f9fc;
    border: 1px solid rgba(255,255,255,.12);
    display: flex;
    flex-direction: column;
}
.phone-status {
    height: 34px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    color: #203246;
    font-size: 12px;
    font-weight: 900;
    background: #fff;
}
.phone-content {
    flex: 1;
    overflow: hidden;
    padding: 16px;
}
.mobile-title {
    font-size: 21px;
    line-height: 1.25;
    font-weight: 950;
    margin: 0 0 8px;
}
.mobile-sub {
    margin: 0 0 14px;
    color: var(--muted);
}
.mobile-card {
    background: #fff;
    border: 1px solid #dfe6ef;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
}
.mobile-card.soft {
    background: var(--soft-teal);
    border-color: #cbece8;
}
.input-box {
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid #dbe3ec;
    background: #fff;
    padding: 12px;
    margin: 9px 0;
    color: #203246;
    font-weight: 800;
}
.primary-btn {
    width: 100%;
    min-height: 48px;
    border-radius: 14px;
    border: 0;
    background: var(--dark);
    color: #fff;
    font-weight: 950;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
}
.secondary-btn {
    width: 100%;
    min-height: 42px;
    border-radius: 12px;
    border: 1px solid #dbe3ec;
    background: #fff;
    color: #203246;
    font-weight: 850;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
}
.mobile-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 10px;
}
.mobile-tag {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    padding: 3px 8px;
    background: #edf2f7;
    color: #344054;
    font-size: 12px;
    font-weight: 850;
}
.metric-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}
.metric {
    border-radius: 12px;
    background: #fff;
    border: 1px solid #dfe6ef;
    padding: 10px;
}
.metric b {
    display: block;
    font-size: 18px;
}
.metric span {
    color: var(--muted);
    font-size: 11px;
}
.split-mini {
    display: grid;
    grid-template-columns: 70fr 15fr 10fr 5fr;
    overflow: hidden;
    border-radius: 12px;
    margin: 10px 0;
}
.split-mini div {
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    text-align: center;
}
.split-mini .a { background: var(--blue); }
.split-mini .b { background: var(--amber); }
.split-mini .c { background: var(--green); }
.split-mini .d { background: var(--purple); }
.phone-list {
    display: grid;
    gap: 8px;
}
.phone-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid #e5ebf1;
}
.phone-row:last-child { border-bottom: 0; }
.amount {
    font-weight: 950;
    color: var(--green);
}
.step-actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.nav-btn {
    min-height: 38px;
    border: 1px solid var(--line);
    background: #fff;
    color: #203246;
    border-radius: 8px;
    padding: 8px 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 850;
    cursor: pointer;
}
.nav-btn.primary {
    background: var(--dark);
    border-color: var(--dark);
    color: #fff;
}
@media (max-width: 980px) {
    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }
    .top-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
    }
    .workspace {
        grid-template-columns: 1fr;
    }
    .intro {
        grid-template-columns: 1fr;
    }
    .phone {
        width: min(390px, calc(100vw - 36px));
        height: 760px;
    }
}
@media (max-width: 620px) {
    .shell { padding: 10px; }
    .intro h1 { font-size: 23px; }
    .step-tab { flex: 1 1 160px; }
    .db-panel { padding: 14px; }
    .panel-head {
        flex-direction: column;
    }
    .db-row {
        grid-template-columns: 1fr;
        gap: 2px;
    }
    .phone {
        height: 720px;
        padding: 10px;
        border-radius: 30px;
    }
    .screen { border-radius: 22px; }
}
</style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="index.html">
        <span class="brand-mark"><i data-lucide="panel-left"></i></span>
        <span>流程原型：手机界面 + 数据库变化</span>
    </a>
    <nav class="top-actions">
        <a href="index.html"><i data-lucide="home"></i>文档首页</a>
        <a href="quotation-minimal.html"><i data-lucide="file-text"></i>Lean MVP</a>
        <a href="revenue-mechanism-thoughts-slides.html"><i data-lucide="presentation"></i>分润 Slides</a>
    </nav>
</header>

<main class="shell">
    <section class="intro">
        <div>
            <h1>每次只看一个小动作</h1>
            <p>右边是手机模拟器里的界面，左边是这一动作背后的数据库读写。这样能把“注册、上架方案、购买、反馈入池、分润结算”拆成可讨论的小点。</p>
        </div>
        <div class="step-actions">
            <button class="nav-btn" id="prevBtn"><i data-lucide="arrow-left"></i>上一小点</button>
            <button class="nav-btn primary" id="nextBtn">下一小点<i data-lucide="arrow-right"></i></button>
        </div>
    </section>

    <nav class="step-nav" id="stepNav"></nav>

    <section class="workspace">
        <aside class="panel db-panel">
            <div class="panel-head">
                <div>
                    <h2 id="dbTitle">数据库变化</h2>
                    <p id="dbSubtitle"></p>
                </div>
                <span class="badge" id="actorBadge"></span>
            </div>
            <div class="db-flow" id="dbFlow"></div>
            <div class="explain" id="stepExplain"></div>
        </aside>

        <aside class="phone-area">
            <div class="phone-label">
                <span id="phoneMode">手机界面</span>
                <span id="screenName">Screen</span>
            </div>
            <div class="phone">
                <div class="screen">
                    <div class="phone-status"><span>9:41</span><span>5G 100%</span></div>
                    <div class="phone-content" id="phoneContent"></div>
                </div>
            </div>
        </aside>
    </section>
</main>

<script>
const steps = [
    {
        key: "register",
        icon: "user-plus",
        tab: "注册登录",
        title: "01 注册登录：先建立用户身份",
        actor: "现在用户",
        screen: "用户登录页",
        subtitle: "用户用手机号进入系统，系统只建立基础身份和授权记录，不产生任何分润。",
        explain: "这一小点的目标是让平台知道“谁在买方案”。注册本身不产生收益，也不会进入老用户池。",
        db: [
            { table: "users", op: "INSERT", tone: "insert", rows: [
                ["id", "U1001"],
                ["phone", "138****0912"],
                ["role", "buyer"],
                ["identity_status", "pending"],
                ["created_at", "2026-05-20 16:10"]
            ]},
            { table: "user_consents", op: "INSERT", tone: "insert", rows: [
                ["user_id", "U1001"],
                ["consent_type", "service_terms"],
                ["version", "v1.0"],
                ["status", "accepted"]
            ]},
            { table: "login_sessions", op: "INSERT", tone: "insert", rows: [
                ["user_id", "U1001"],
                ["device", "iPhone"],
                ["expires_at", "2026-06-19 16:10"]
            ]}
        ],
        phone: `
            <h2 class="mobile-title">登录诊疗方案商城</h2>
            <p class="mobile-sub">购买方案、查看订单、提交反馈和查看收益，都从同一个身份开始。</p>
            <div class="mobile-card">
                <div class="input-box">手机号 138 **** 0912</div>
                <div class="input-box">验证码 826419</div>
                <button class="primary-btn"><i data-lucide="log-in"></i>登录 / 注册</button>
                <button class="secondary-btn"><i data-lucide="file-check"></i>已阅读服务协议</button>
            </div>
            <div class="mobile-card soft">
                <b>这里不会分润</b>
                <p class="mobile-sub" style="margin-top:6px;">只是建立用户身份。后面真实订单完成后，才会生成分润流水。</p>
            </div>
        `
    },
    {
        key: "publish",
        icon: "store",
        tab: "上架方案",
        title: "02 上架方案：商品是诊疗服务包",
        actor: "方案运营方",
        screen: "机构端上架页",
        subtitle: "机构提交方案，平台保留版本快照。用户未来买的是这个方案服务包，不是患者原始数据。",
        explain: "上架动作会写入方案和版本表。审核通过前，C 端用户看不到这个商品。",
        db: [
            { table: "medical_plans", op: "INSERT", tone: "insert", rows: [
                ["id", "P3008"],
                ["title", "肝癌术后管理方案 A"],
                ["operator_id", "ORG018"],
                ["price", "980.00"],
                ["status", "pending_review"]
            ]},
            { table: "plan_versions", op: "INSERT", tone: "insert", rows: [
                ["plan_id", "P3008"],
                ["version_no", "v1"],
                ["content_snapshot", "服务内容 + 风险提示 + 退款规则"],
                ["approved_by", "null"]
            ]},
            { table: "audit_logs", op: "INSERT", tone: "insert", rows: [
                ["actor_id", "ORG018_ADMIN"],
                ["action", "submit_plan"],
                ["target_id", "P3008"]
            ]}
        ],
        phone: `
            <h2 class="mobile-title">上架诊疗方案</h2>
            <p class="mobile-sub">机构端提交。审核通过后，才进入商城。</p>
            <div class="mobile-card">
                <div class="input-box">方案名称：肝癌术后管理方案 A</div>
                <div class="input-box">价格：¥980</div>
                <div class="input-box">服务内容：复诊提醒、指标跟踪、随访管理</div>
                <div class="input-box">风险提示：不承诺治愈，需线下医生判断</div>
                <button class="primary-btn"><i data-lucide="send"></i>提交审核</button>
            </div>
            <div class="mobile-tags">
                <span class="mobile-tag">pending_review</span>
                <span class="mobile-tag">version v1</span>
            </div>
        `
    },
    {
        key: "browse",
        icon: "search",
        tab: "看方案",
        title: "03 看方案：读取商品和老用户背书",
        actor: "现在用户",
        screen: "方案详情页",
        subtitle: "用户看的是方案内容、价格、适用人群和老用户脱敏反馈。浏览本身不参与分润计算。",
        explain: "这一步主要是读取数据。为了避免变成复杂路径追踪，MVP 不按浏览路径分润。",
        db: [
            { table: "medical_plans", op: "SELECT", tone: "select", rows: [
                ["where", "id = P3008"],
                ["return", "title, price, operator, risk_notice"],
                ["purpose", "展示方案详情"]
            ]},
            { table: "review_evidence", op: "SELECT", tone: "select", rows: [
                ["where", "plan_id = P3008 and audit_status = approved"],
                ["return", "脱敏摘要、指标变化、体验反馈"],
                ["purpose", "展示老用户背书"]
            ]},
            { table: "plan_user_pool", op: "SELECT", tone: "select", rows: [
                ["where", "plan_id = P3008 and share_status = active"],
                ["return", "有效老用户数量 48"],
                ["purpose", "显示可信度，不触发收益"]
            ]}
        ],
        phone: `
            <h2 class="mobile-title">肝癌术后管理方案 A</h2>
            <p class="mobile-sub">省肿瘤专病团队 · 服务包 ¥980</p>
            <div class="mobile-tags">
                <span class="mobile-tag">治疗后管理</span>
                <span class="mobile-tag">老用户 48 人</span>
                <span class="mobile-tag">T+7 结算</span>
            </div>
            <div class="mobile-card">
                <b>服务内容</b>
                <p class="mobile-sub" style="margin-top:6px;">复诊提醒、指标跟踪、用药依从性记录、随访管理。</p>
            </div>
            <div class="mobile-card soft">
                <b>老用户背书</b>
                <div class="phone-row"><span>术后 3 月随访摘要</span><span class="amount">已审核</span></div>
                <div class="phone-row"><span>复查节点完成率</span><span class="amount">82%</span></div>
            </div>
            <button class="primary-btn"><i data-lucide="shopping-bag"></i>购买方案</button>
        `
    },
    {
        key: "order",
        icon: "receipt",
        tab: "购买方案",
        title: "04 购买方案：订单是分润的唯一触发源",
        actor: "现在用户",
        screen: "订单确认页",
        subtitle: "支付成功后，系统锁定方案版本、价格快照和推荐人 R。没有真实订单，就没有任何收益分配。",
        explain: "这是最关键的小点：分润不是凭空产生，也不是老用户直接卖数据，而是来自一笔真实方案订单。",
        db: [
            { table: "orders", op: "INSERT", tone: "insert", rows: [
                ["id", "O9001"],
                ["buyer_id", "U1001"],
                ["plan_id", "P3008"],
                ["amount", "980.00"],
                ["status", "paid"]
            ]},
            { table: "order_snapshots", op: "INSERT", tone: "insert", rows: [
                ["order_id", "O9001"],
                ["plan_version", "P3008 / v1"],
                ["split_rule", "70/15/10/5"],
                ["refund_rule", "T+7 冻结期"]
            ]},
            { table: "referrals", op: "INSERT", tone: "insert", rows: [
                ["order_id", "O9001"],
                ["referrer_id", "R2007"],
                ["level", "1"],
                ["status", "locked"]
            ]}

let current = 0;

function renderTabs() {
    document.getElementById("stepNav").innerHTML = steps.map((s, i) => `
        <button class="step-tab ${i === current ? "active" : ""}" data-index="${i}">
            <i data-lucide="${s.icon}"></i>${s.tab}
        </button>
    `).join("");
    document.querySelectorAll(".step-tab").forEach(btn => {
        btn.addEventListener("click", () => {
            current = Number(btn.dataset.index);
            render();
        });
    });
}

function renderDb(step) {
    document.getElementById("dbFlow").innerHTML = step.db.map(card => `
        <article class="db-card">
            <div class="db-card-head">
                <span class="db-table">${card.table}</span>
                <span class="db-op ${card.tone}">${card.op}</span>
            </div>
            <div class="db-body">
                ${card.rows.map(row => `
                    <div class="db-row">
                        <div class="db-key">${row[0]}</div>
                        <div class="db-val">${row[1]}</div>
                    </div>
                `).join("")}
            </div>
        </article>
    `).join("");
}

function render() {
    const step = steps[current];
    renderTabs();
    document.getElementById("dbTitle").textContent = step.title;
    document.getElementById("dbSubtitle").textContent = step.subtitle;
    document.getElementById("actorBadge").textContent = step.actor;
    document.getElementById("stepExplain").textContent = step.explain;
    document.getElementById("phoneMode").textContent = step.actor + "视角";
    document.getElementById("screenName").textContent = step.screen;
    document.getElementById("phoneContent").innerHTML = step.phone;
    renderDb(step);
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").disabled = current === steps.length - 1;
    lucide.createIcons();
}

document.getElementById("prevBtn").addEventListener("click", () => {
    if (current > 0) {
        current -= 1;
        render();
    }
});
document.getElementById("nextBtn").addEventListener("click", () => {
    if (current < steps.length - 1) {
        current += 1;
        render();
    }
});

render();
</script>
