<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疑难病诊疗方案商城 - 流程原型</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { box-sizing: border-box; }
:root {
    --bg: #eef2f6;
    --paper: #ffffff;
    --ink: #1f2937;
    --muted: #617083;
    --line: #d8e0ea;
    --dark: #203246;
    --blue: #2c6fad;
    --teal: #168f83;
    --green: #357f4d;
    --amber: #b7791f;
    --coral: #c2414e;
    --purple: #6b46c1;
    --soft-blue: #edf4ff;
    --soft-teal: #e6f6f4;
    --soft-green: #e9f7ef;
    --soft-amber: #fff4dd;
    --soft-coral: #ffecef;
    --shadow: 0 18px 42px rgba(31, 41, 55, 0.11);
}
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.58;
    overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }
.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 22px;
    background: rgba(255, 255, 255, .94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(14px);
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
}
.brand-mark {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: var(--soft-teal);
    color: var(--teal);
}
.top-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.top-actions a {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: #344054;
    font-weight: 800;
}
.shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 18px;
}
.intro {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: end;
    margin-bottom: 14px;
}
.intro h1, .intro p { margin: 0; }
.intro h1 {
    font-size: 28px;
    line-height: 1.22;
}
.intro p {
    color: var(--muted);
    margin-top: 8px;
    max-width: 760px;
}
.step-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 18px;
}
.step-tab {
    border: 1px solid var(--line);
    background: #fff;
    color: #344054;
    min-height: 38px;
    padding: 8px 11px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 850;
    cursor: pointer;
}
.step-tab.active {
    background: var(--dark);
    color: #fff;
    border-color: var(--dark);
}
.workspace {
    display: grid;
    grid-template-columns: minmax(420px, 1fr) 430px;
    gap: 18px;
    align-items: start;
}
.panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    min-width: 0;
}
.db-panel {
    padding: 18px;
}
.panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
}
.panel-head h2, .panel-head p { margin: 0; }
.panel-head h2 {
    font-size: 21px;
    line-height: 1.25;
}
.panel-head p {
    color: var(--muted);
    margin-top: 6px;
}
.badge {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
}
.db-flow {
    display: grid;
    gap: 12px;
}
.db-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
}
.db-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: #f6f8fb;
    border-bottom: 1px solid var(--line);
}
.db-table {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-weight: 800;
    color: #203246;
}
.db-op {
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    border-radius: 999px;
    padding: 3px 8px;
    background: var(--blue);
}
.db-op.insert { background: var(--green); }
.db-op.update { background: var(--amber); }
.db-op.select { background: var(--purple); }
.db-op.freeze { background: var(--coral); }
.db-body {
    padding: 12px;
}
.db-row {
    display: grid;
    grid-template-columns: 132px minmax(0, 1fr);
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #e4e9ef;
}
.db-row:last-child { border-bottom: 0; }
.db-key {
    color: var(--muted);
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
}
.db-val {
    overflow-wrap: anywhere;
    font-weight: 720;
}
.explain {
    margin-top: 14px;
    padding: 13px 14px;
    border-left: 4px solid var(--teal);
    border-radius: 0 10px 10px 0;
    background: var(--soft-teal);
    color: #29465b;
}
.phone-area {
    display: grid;
    justify-content: center;
    gap: 12px;
}
.phone-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    color: var(--muted);
    font-weight: 800;
}
.phone {
    width: 390px;
    height: 780px;
    border-radius: 38px;
    background: #111827;
    padding: 14px;
    box-shadow: 0 24px 55px rgba(17, 24, 39, .28);
    position: relative;
}
.phone::before {
    content: "";
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 23px;
    border-radius: 0 0 16px 16px;
    background: #111827;
    z-index: 2;
}
.screen {
    height: 100%;
    overflow: hidden;
    border-radius: 28px;
    background: #f7f9fc;
    border: 1px solid rgba(255,255,255,.12);
    display: flex;
    flex-direction: column;
}
.phone-status {
    height: 34px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    color: #203246;
    font-size: 12px;
    font-weight: 900;
    background: #fff;
}
.phone-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}
.phone-content::-webkit-scrollbar {
    width: 0;
}
.mobile-title {
    font-size: 21px;
    line-height: 1.25;
    font-weight: 950;
    margin: 0 0 8px;
}
.mobile-sub {
    margin: 0 0 14px;
    color: var(--muted);
}
.mobile-card {
    background: #fff;
    border: 1px solid #dfe6ef;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
}
.mobile-card.soft {
    background: var(--soft-teal);
    border-color: #cbece8;
}
.mobile-card.warn {
    background: var(--soft-amber);
    border-color: #f2d394;
}
.mobile-card.danger {
    background: var(--soft-coral);
    border-color: #f3bec5;
}
.mobile-card.success {
    background: var(--soft-green);
    border-color: #bee7ca;
}
.status-note {
    display: none;
    border-radius: 12px;
    padding: 10px 12px;
    margin-top: 10px;
    background: var(--soft-blue);
    border: 1px solid #c8ddf8;
    color: #25456a;
    font-weight: 850;
}
.status-note.show {
    display: block;
}
.status-note.danger {
    background: var(--soft-coral);
    border-color: #f3bec5;
    color: #8f2430;
}
.status-note.success {
    background: var(--soft-green);
    border-color: #bee7ca;
    color: #23613a;
}
.mini-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    font-weight: 950;
    margin-bottom: 8px;
}
.tiny {
    color: var(--muted);
    font-size: 11px;
}
.check-list {
    display: grid;
    gap: 8px;
}
.check-line {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
}
.check-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--soft-green);
    color: var(--green);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 950;
}
.mini-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
}
.mini-box {
    border: 1px solid #dfe6ef;
    border-radius: 12px;
    background: #fff;
    padding: 10px;
}
.mini-box b {
    display: block;
    font-size: 14px;
}
.notice {
    border-left: 4px solid var(--teal);
    background: var(--soft-teal);
    border-radius: 0 12px 12px 0;
    padding: 10px 12px;
    margin: 10px 0;
}
.segment {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    padding: 4px;
    border-radius: 12px;
    background: #e9eef5;
    margin-bottom: 10px;
}
.segment span {
    text-align: center;
    border-radius: 9px;
    padding: 7px 4px;
    font-size: 12px;
    font-weight: 900;
    color: #667085;
    cursor: pointer;
}
.segment span.active {
    background: #fff;
    color: var(--dark);
    box-shadow: 0 4px 10px rgba(31, 41, 55, .08);
}
.timeline-mini {
    display: grid;
    gap: 8px;
}
.timeline-mini .line {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 8px;
}
.line-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 12px;
    font-weight: 950;
}
.input-box {
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid #dbe3ec;
    background: #fff;
    padding: 12px;
    margin: 9px 0;
    color: #203246;
    font-weight: 800;
}
.input-box.small {
    min-height: 38px;
    padding: 9px 10px;
    margin: 7px 0;
    font-size: 12px;
}
.primary-btn {
    width: 100%;
    min-height: 48px;
    border-radius: 14px;
    border: 0;
    background: var(--dark);
    color: #fff;
    font-weight: 950;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    cursor: pointer;
}
.secondary-btn {
    width: 100%;
    min-height: 42px;
    border-radius: 12px;
    border: 1px solid #dbe3ec;
    background: #fff;
    color: #203246;
    font-weight: 850;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
    cursor: pointer;
}
.phone-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 8px;
}
.phone-actions .primary-btn,
.phone-actions .secondary-btn {
    margin-top: 0;
    min-height: 40px;
    border-radius: 12px;
    font-size: 12px;
}
.link-button {
    border: 0;
    background: transparent;
    color: var(--blue);
    font-weight: 900;
    padding: 0;
    cursor: pointer;
}
.mobile-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 10px;
}
.mobile-tag {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    padding: 3px 8px;
    background: #edf2f7;
    color: #344054;
    font-size: 12px;
    font-weight: 850;
}
.mobile-tag.blue { background: var(--soft-blue); color: var(--blue); }
.mobile-tag.teal { background: var(--soft-teal); color: var(--teal); }
.mobile-tag.green { background: var(--soft-green); color: var(--green); }
.mobile-tag.amber { background: var(--soft-amber); color: var(--amber); }
.mobile-tag.coral { background: var(--soft-coral); color: var(--coral); }
.store-card {
    background: #fff;
    border: 1px solid #dfe6ef;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
}
.store-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 6px;
}
.store-card.blue::before { background: var(--blue); }
.store-card.teal::before { background: var(--teal); }
.store-card.amber::before { background: var(--amber); }
.store-card.coral::before { background: var(--coral); }
.store-card .store-inner { padding-left: 8px; }
.color-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 10px 0;
}
.color-tile {
    min-height: 56px;
    border-radius: 14px;
    padding: 10px;
    color: #203246;
    font-weight: 900;
}
.color-tile span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
}
.color-tile.blue { background: var(--soft-blue); }
.color-tile.teal { background: var(--soft-teal); }
.color-tile.amber { background: var(--soft-amber); }
.color-tile.coral { background: var(--soft-coral); }
.doc-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}
.doc-chip {
    border: 1px solid #dfe6ef;
    border-radius: 999px;
    background: #fff;
    padding: 4px 8px;
    color: #344054;
    font-size: 11px;
    font-weight: 850;
}
.custom-field {
    display: grid;
    gap: 7px;
}
.field-row {
    border: 1px dashed #cdd7e3;
    border-radius: 12px;
    background: #fbfcfe;
    padding: 9px 10px;
    color: #203246;
    font-size: 12px;
    font-weight: 850;
}
.task-state {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    border-radius: 999px;
    padding: 2px 7px;
    background: #eef2f7;
    color: #475467;
    font-size: 11px;
    font-weight: 900;
}
.task-state.done { background: var(--soft-green); color: var(--green); }
.task-state.todo { background: var(--soft-amber); color: var(--amber); }
.task-state.block { background: var(--soft-coral); color: var(--coral); }
.metric-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}
.metric {
    border-radius: 12px;
    background: #fff;
    border: 1px solid #dfe6ef;
    padding: 10px;
}
.metric b {
    display: block;
    font-size: 18px;
}
.metric span {
    color: var(--muted);
    font-size: 11px;
}
.split-mini {
    display: grid;
    grid-template-columns: 70fr 15fr 10fr 5fr;
    overflow: hidden;
    border-radius: 12px;
    margin: 10px 0;
}
.split-mini div {
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    text-align: center;
}
.split-mini .a { background: var(--blue); }
.split-mini .b { background: var(--amber); }
.split-mini .c { background: var(--green); }
.split-mini .d { background: var(--purple); }
.phone-list {
    display: grid;
    gap: 8px;
}
.phone-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid #e5ebf1;
}
.phone-row:last-child { border-bottom: 0; }
.amount {
    font-weight: 950;
    color: var(--green);
}
.step-actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.nav-btn {
    min-height: 38px;
    border: 1px solid var(--line);
    background: #fff;
    color: #203246;
    border-radius: 8px;
    padding: 8px 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 850;
    cursor: pointer;
}
.nav-btn.primary {
    background: var(--dark);
    border-color: var(--dark);
    color: #fff;
}
@media (max-width: 980px) {
    .topbar {
        align-items: stretch;
        flex-direction: column;
    }
    .top-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
    }
    .workspace {
        grid-template-columns: 1fr;
    }
    .intro {
        grid-template-columns: 1fr;
    }
    .step-actions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .nav-btn {
        min-width: 0;
        justify-content: center;
    }
    .phone {
        width: min(390px, calc(100vw - 36px));
        height: 760px;
    }
}
@media (max-width: 620px) {
    .shell {
        width: min(100vw, 390px);
        margin-left: 0;
        margin-right: 0;
        padding: 10px;
    }
    .topbar {
        width: min(100vw, 390px);
    }
    .topbar,
    .shell,
    .intro,
    .step-nav,
    .workspace {
        max-width: 100vw;
        min-width: 0;
    }
    .intro h1 { font-size: 23px; }
    .top-actions {
        grid-template-columns: 1fr;
    }
    .step-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .step-tab {
        min-width: 0;
        width: 100%;
        justify-content: flex-start;
    }
    .db-panel { padding: 14px; }
    .phone-area {
        order: -1;
    }
    .panel-head {
        flex-direction: column;
    }
    .db-row {
        grid-template-columns: 1fr;
        gap: 2px;
    }
    .phone {
        width: min(360px, calc(100vw - 28px));
        height: 720px;
        padding: 10px;
        border-radius: 30px;
    }
    .screen { border-radius: 22px; }
}
</style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="index.html">
        <span class="brand-mark"><i data-lucide="panel-left"></i></span>
        <span>流程原型：手机界面 + 数据库变化</span>
    </a>
    <nav class="top-actions">
        <a href="index.html"><i data-lucide="home"></i>文档首页</a>
        <a href="quotation-minimal.html"><i data-lucide="file-text"></i>Lean MVP</a>
        <a href="revenue-mechanism-thoughts-slides.html"><i data-lucide="presentation"></i>分润 Slides</a>
    </nav>
</header>

<main class="shell">
    <section class="intro">
        <div>
            <h1>每次只看一个小动作</h1>
            <p>右边是手机模拟器里的界面，左边是这一动作背后的数据库读写。这里把“注册、机构入驻、方案上架、展示、购买、履约、反馈、授权、分润”拆成更细的小点，避免停留在概念层。</p>
        </div>
        <div class="step-actions">
            <button class="nav-btn" id="prevBtn"><i data-lucide="arrow-left"></i>上一小点</button>
            <button class="nav-btn primary" id="nextBtn">下一小点<i data-lucide="arrow-right"></i></button>
        </div>
    </section>

    <nav class="step-nav" id="stepNav"></nav>

    <section class="workspace">
        <aside class="panel db-panel">
            <div class="panel-head">
                <div>
                    <h2 id="dbTitle">数据库变化</h2>
                    <p id="dbSubtitle"></p>
                </div>
                <span class="badge" id="actorBadge"></span>
            </div>
            <div class="db-flow" id="dbFlow"></div>
            <div class="explain" id="stepExplain"></div>
        </aside>

        <aside class="phone-area">
            <div class="phone-label">
                <span id="phoneMode">手机界面</span>
                <span id="screenName">Screen</span>
            </div>
            <div class="phone">
                <div class="screen">
                    <div class="phone-status"><span>9:41</span><span>5G 100%</span></div>
                    <div class="phone-content" id="phoneContent"></div>
                </div>
            </div>
        </aside>
    </section>
</main>

<script>
const steps = [
    {
        key: "user_identity",
        icon: "user-check",
        tab: "用户实名",
        title: "01 用户实名：先把买家身份和授权做完整",

const initialStepParam = Number(new URLSearchParams(window.location.search).get("step") || 0);
let current = Number.isFinite(initialStepParam)
    ? Math.min(Math.max(initialStepParam, 0), steps.length - 1)
    : 0;

function renderTabs() {
    document.getElementById("stepNav").innerHTML = steps.map((s, i) => `
        <button class="step-tab ${i === current ? "active" : ""}" data-index="${i}">
            <i data-lucide="${s.icon}"></i>${s.tab}
        </button>
    `).join("");
    document.querySelectorAll(".step-tab").forEach(btn => {
        btn.addEventListener("click", () => {
            current = Number(btn.dataset.index);
            render();
        });
    });
}

    document.getElementById("dbFlow").innerHTML = step.db.map(card => `

            <div class="db-body">
                ${card.rows.map(row => `
                    <div class="db-row">

}

function showStatus(id, kind = "") {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("danger", "success");
    if (kind) el.classList.add(kind);
    el.classList.add("show");
}

function bindPhoneInteractions() {
    const content = document.getElementById("phoneContent");
    content.onclick = event => {
        const tab = event.target.closest("[data-detail-tab]");
        if (tab) {
            content.querySelectorAll("[data-detail-tab]").forEach(item => item.classList.remove("active"));
            tab.classList.add("active");
            const body = document.getElementById("detailTabBody");
            if (body) body.innerHTML = detailTabTemplates[tab.dataset.detailTab] || detailTabTemplates.overview;
            return;
        }

        const adminBtn = event.target.closest("[data-admin-result]");
        if (adminBtn) {
            const status = document.getElementById("adminReviewStatus");
            if (!status) return;
            if (adminBtn.dataset.adminResult === "reject") {
                status.textContent = "审核不通过：宣传语涉嫌承诺疗效，且退款说明缺少未履约场景。已退回机构修改。";
                showStatus("adminReviewStatus", "danger");
            } else {
                status.textContent = "审核通过：方案 v1 已发布到商城，后续订单锁定此版本快照。";
                showStatus("adminReviewStatus", "success");
            }
            return;
        }

        const actionBtn = event.target.closest("[data-action]");
        if (!actionBtn) return;
        const action = actionBtn.dataset.action;
        if (action === "wechat-login") showStatus("wechatStatus");
        if (action === "submit-org") showStatus("orgSubmitStatus", "success");
        if (action === "upload-report") showStatus("reportUploadStatus", "success");
        if (action === "withdraw") showStatus("withdrawStatus", "success");
        if (action === "add-custom-field") {
            const fields = document.getElementById("customFields");
            if (fields) {
                const node = document.createElement("div");
                node.className = "field-row";
                node.textContent = "新增：随访频率说明 · 下拉 + 长文本 · 运营方自定义";
                fields.appendChild(node);
            }
        }
    };
}

function render() {
    const step = steps[current];
    renderTabs();
    document.getElementById("dbTitle").textContent = step.title;
    document.getElementById("dbSubtitle").textContent = step.subtitle;
    document.getElementById("actorBadge").textContent = step.actor;
    document.getElementById("stepExplain").textContent = step.explain;
    document.getElementById("phoneMode").textContent = step.actor + "视角";
    document.getElementById("screenName").textContent = step.screen;
    document.getElementById("phoneContent").innerHTML = step.phone;
    renderDb(step);
    bindPhoneInteractions();
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").disabled = current === steps.length - 1;
    lucide.createIcons();
}

document.getElementById("prevBtn").addEventListener("click", () => {
    if (current > 0) {
        current -= 1;
        render();
    }
});
document.getElementById("nextBtn").addEventListener("click", () => {
    if (current < steps.length - 1) {
        current += 1;
        render();
    }
});

render();
